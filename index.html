<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z4W3R14 — Contos de Terror Adulto</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --fundo: #070707;
  --texto: #e8e8e8;
  --texto-suave: #a0a0a0;
  --borda: #1a1a1a;
}
html, body {
  background: var(--fundo);
  color: var(--texto);
  font-family: "Georgia", "Times New Roman", serif;
  line-height: 1.7;
  overflow-x: hidden;
  min-height: 100vh;
}
.container { max-width: 900px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 20; }
.site-header {
  position: relative; z-index: 20;
  background: rgba(7, 7, 7, 0.94);
  border-bottom: 1px solid var(--borda);
  padding: 16px 0; backdrop-filter: blur(4px);
}
.header-inner {
  display: flex; justify-content: space-between; align-items: center;
  max-width: 900px; margin: 0 auto; padding: 0 20px;
}
.logo {
  font-size: 1.8rem; font-weight: bold;
  text-decoration: none; color: var(--texto); text-transform: uppercase;
  letter-spacing: 1px;
}
.logo:hover { color: var(--texto); }
nav a {
  color: var(--texto-suave); margin-left: 22px;
  text-decoration: none; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;
}
nav a:hover { color: var(--texto); }
.hero {
  position: relative; z-index: 20;
  padding: 110px 0 90px; text-align: center;
}
.hero h1 {
  font-size: 3.2rem; margin-bottom: 16px;
  color: var(--texto);
  text-transform: uppercase;
  letter-spacing: 2px;
  line-height: 1.1;
}
.subtitle {
  font-size: 1.2rem; color: var(--texto-suave);
  margin-bottom: 40px; max-width: 600px;
  margin-left: auto; margin-right: auto;
}
.btn {
  display: inline-block; background: transparent;
  color: var(--texto); padding: 14px 34px;
  text-decoration: none; font-weight: bold; font-size: 0.95rem;
  border: 1px solid var(--texto); text-transform: uppercase; letter-spacing: 1px;
  transition: 0.3s;
}
.btn:hover { background: var(--texto); color: #000; }
.intro {
  position: relative; z-index: 20;
  padding: 70px 0;
  border-top: 1px solid var(--borda); border-bottom: 1px solid var(--borda);
}
.intro p {
  font-size: 1.1rem; color: var(--texto-suave);
  max-width: 700px; margin: 0 auto; text-align: center; font-style: italic;
}
.site-footer {
  position: relative; z-index: 20;
  margin-top: 60px; padding: 30px 0;
  text-align: center; font-size: 0.85rem; color: #666;
  border-top: 1px solid var(--borda);
}
@media (max-width: 600px) {
  .hero h1 { font-size: 2.1rem; }
  .header-inner { flex-direction: column; gap: 12px; text-align: center; }
  nav a { margin: 0 8px; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="#" class="logo">Z4W3R14</a>
    <nav>
      <a href="#">Início</a>
      <a href="#">Contos</a>
      <a href="#">Sobre</a>
    </nav>
  </div>
</header>

<main class="hero">
  <div class="container">
    <h1>Contos de Terror Adulto</h1>
    <p class="subtitle">Histórias sombrias para ler com a luz acesa.</p>
    <a href="#" class="btn">Entrar nos contos</a>
  </div>
</main>

<section class="intro">
  <div class="container">
    <p>Bem-vindo ao Z4W3R14. Aqui o medo não tem idade, e os espelhos nunca mentem — eles apenas mostram o que já está dentro de você.</p>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <p>&copy; 2026 Z4W3R14 — Contos de Terror Adulto.</p>
  </div>
</footer>

</body>
</html>
