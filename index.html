<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z4W3R14 — Contos de Terror Adulto</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --sangue: #8b0000;
  --sangue-vivo: #b20000;
  --fundo: #070707;
  --texto: #e8e8e8;
  --texto-suave: #a0a0a0;
  --borda: #1a1a1a;
}
html, body {
  background: var(--fundo);
  color: var(--texto);
  font-family: "Georgia", "Times New Roman", serif;
  line-height: 1.7;
  overflow-x: hidden;
  min-height: 100vh;
}
.container { max-width: 900px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 20; }
/* SVG fixo nas bordas */
.blood-svg {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  pointer-events: none;
  z-index: 15;
  display: block;
}
.site-header {
  position: relative; z-index: 20;
  background: rgba(7, 7, 7, 0.94);
  border-bottom: 2px solid var(--sangue);
  padding: 16px 0; backdrop-filter: blur(4px);
}
.header-inner {
  display: flex; justify-content: space-between; align-items: center;
  max-width: 900px; margin: 0 auto; padding: 0 20px;
}
.logo {
  font-size: 1.7rem; font-weight: bold; letter-spacing: 4px;
  text-decoration: none; color: var(--texto); text-transform: uppercase;
}
.logo:hover { color: var(--sangue-vivo); }
nav a {
  color: var(--texto-suave); margin-left: 22px;
  text-decoration: none; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;
}
nav a:hover { color: var(--sangue-vivo); }
.hero {
  position: relative; z-index: 20;
  padding: 110px 0 90px; text-align: center;
}
.hero h1 {
  font-size: 3.2rem; margin-bottom: 16px;
  color: var(--sangue-vivo);
  text-shadow: 0 0 14px rgba(139, 0, 0, 0.5), 2px 2px 0 #000;
  line-height: 1.1;
}
.subtitle {
  font-size: 1.2rem; color: var(--texto-suave);
  margin-bottom: 40px; max-width: 600px;
  margin-left: auto; margin-right: auto;
}
.btn {
  display: inline-block; background: transparent;
  color: var(--sangue-vivo); padding: 14px 34px;
  text-decoration: none; font-weight: bold; font-size: 0.95rem;
  border: 2px solid var(--sangue-vivo); text-transform: uppercase; letter-spacing: 1px;
  transition: 0.3s;
}
.btn:hover { background: var(--sangue-vivo); color: #fff; box-shadow: 0 0 20px rgba(178, 0, 0, 0.5); }
.intro {
  position: relative; z-index: 20;
  padding: 70px 0;
  border-top: 1px solid var(--borda); border-bottom: 1px solid var(--borda);
}
.intro p {
  font-size: 1.1rem; color: var(--texto-suave);
  max-width: 700px; margin: 0 auto; text-align: center; font-style: italic;
}
.site-footer {
  position: relative; z-index: 20;
  margin-top: 60px; padding: 30px 0;
  text-align: center; font-size: 0.85rem; color: #666;
  border-top: 1px solid var(--borda);
}
@media (max-width: 600px) {
  .hero h1 { font-size: 2.1rem; }
  .header-inner { flex-direction: column; gap: 12px; text-align: center; }
  nav a { margin: 0 8px; }
  .blood-svg { display: none; }
}
</style>
</head>
